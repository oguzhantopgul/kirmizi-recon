[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kirmizi-recon"
version = "0.1.0"
description = "AI Red Teaming Recon Agent — hybrid reconnaissance (AI application + infrastructure) driven by Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "anthropic>=0.116.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "dnspython>=2.6",
    "rich>=13.7",
    "typer>=0.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
kirmizi-recon = "kirmizi_recon.cli:app"

[tool.setuptools.packages.find]
include = ["kirmizi_recon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
